[package]
name = "zenith-integration-tests"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Test-only crate: deploys every Zenith contract into one Env and walks the
# governance handover (docs/governance-handover.md) stage by stage. Its
# options_market dev-dependency needs other contracts' wasm to compile;
# `cargo xtask test` builds those first (from options_market's
# `[package.metadata.zenith] wasm-deps`).
#
# NOTE (2025-06-01, issue #222): `options_market`, `vault`, and `timelock` are
# under reconstruction and do not currently compile (options_market/src/lib.rs
# is truncated with no `#[contractimpl]` blocks, vault/src/lib.rs is a stub, and
# timelock/ is empty). Until those crates build again, the cross-contract tests
# that depend on them are quarantined with `#[ignore = "..., issue #NNN"]` so
# this crate stays green-or-explicitly-quarantined instead of silently red.
# Re-enable each test as its reconstruction issue lands.

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
multisig = { workspace = true, features = ["testutils"] }
price_oracle = { workspace = true, features = ["testutils"] }
vault = { workspace = true, features = ["testutils"] }
timelock = { workspace = true, features = ["testutils"] }
governor = { workspace = true, features = ["testutils"] }
zenith-test-fixtures = { path = "../test_fixtures", features = ["testutils"] }
# Quarantined pending reconstruction (issue #222):
# options_market = { workspace = true, features = ["testutils"] } # issue #NNN (options_market reconstruction)
