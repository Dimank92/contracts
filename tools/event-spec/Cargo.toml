[package]
name = "event-spec"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Dev-only: checks events emitted in a test Env against the
# machine-readable spec in events.json (#126). Never linked into a wasm.

[lib]
crate-type = ["rlib"]

[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
