```rust
//! `settlement-keeper` binary.
//!
//! Watches `options_market` for expired option series and settles them
//! permissionlessly via `options_market::set_settlement_price_from_oracle`,
//! after checking the `price_oracle` aggregate for freshness and quorum.
//!
//! Usage:
//!   settlement-keeper --once --dry-run
//!   settlement-keeper --poll-interval 60
//!
//! Identity/key material is read from `SETTLEMENT_KEEPER_KEY` (or the
//! `--key` flag) and is never written to disk or logs.

use std::collections::HashSet;
use std::process::ExitCode;
use std::time::Duration;

use clap::Parser;
use settlement_keeper::{decide, Decision, OracleSnapshot, SeriesInfo, SkipReason};
use tracing::{error, info, warn};

/// CLI configuration for the settlement keeper.
#[derive(Debug, Parser)]
#[command(
    name = "settlement-keeper",
    about = "Permissionless settlement keeper for options_market expiry settlement"
)]
struct Cli {
    /// RPC endpoint for the chain.
    #[arg(long, env = "SETTLEMENT_KEEPER_RPC", default_value = "http://127.0.0.1:26657")]
    rpc: String,

    /// Signing key (hex or mnemonic). Prefer the environment variable over the
    /// flag so the key does not appear in shell history or process listings.
    #[arg(long, env = "SETTLEMENT_KEEPER_KEY", hide_env_values = true)]
    key: Option<String>,

    /// Print the intended call and observed oracle state without submitting.
    #[arg(long)]
    dry_run: bool,

    /// Run a single pass and exit.
    #[arg(long)]
    once: bool,

    /// Polling interval in seconds when not running `--once`.
    #[arg(long, default_value_t = 60)]
    poll_interval: u64,

    /// Only consider series expiring within this many seconds (in addition to
    /// already-expired series).
    #[arg(long, default_value_t = 3600)]
    lookahead_secs: i64,

    /// Maximum number of retries for transient RPC failures.
    #[arg(long, default_value_t = 5)]
    max_retries: u32,

    /// Base backoff in milliseconds for retries (doubles each attempt).
    #[arg(long, default_value_t = 250)]
    backoff_ms: u64,
}

/// Errors surfaced by the keeper.
#[derive(Debug, thiserror::Error)]
enum KeeperError {
    #[error("missing signing key: set SETTLEMENT_KEEPER_KEY or pass --key")]
    MissingKey,
    #[error("RPC error: {0}")]
    Rpc(String),
    #[error("refusing to settle {series}: {reason}")]
    Refused { series: String, reason: SkipReason },
    #[error("failed to submit settlement for {series}: {message}")]
    Submit { series: String, message: String },
}

/// A minimal RPC client abstraction. The real implementation talks to the
/// chain; tests can substitute a fake. Kept intentionally small.
trait ChainClient {
    /// Returns the current ledger close time (seconds since epoch).
    fn ledger_time(&mut self) -> Result<i64, KeeperError>;
    /// Lists option series, optionally filtered to those expiring within
    /// `lookahead_secs` of `ledger_time` (or already expired).
    fn list_series(&mut self, ledger_time: i64, lookahead_secs: i64)
        -> Result<Vec<SeriesInfo>, KeeperError>;
    /// Reads the `price_oracle` aggregate for `symbol`.
    fn oracle_snapshot(&mut self, symbol: &str) -> Result<OracleSnapshot, KeeperError>;
    /// Submits `set_settlement_price_from_oracle` for `series_id`.
    fn settle(&mut self, series_id: &str, price: i128) -> Result<(), KeeperError>;
}

/// Retry a fallible operation with exponential backoff.
fn with_retry<T, F>(max_retries: u32, backoff_ms: u64, mut op: F) -> Result<T, KeeperError>
where
    F: FnMut() -> Result<T, KeeperError>,
{
    let mut attempt = 0u32;
    loop {
        match op() {
            Ok(v) => return Ok(v),
            Err(e) => {
                if attempt >= max_retries {
                    return Err(e);
                }
                let delay = backoff_ms.saturating_mul(1u64 << attempt.min(16));
                warn!(attempt, delay_ms = delay, error = %e, "transient RPC failure, retrying");
                std::thread::sleep(Duration::from_millis(delay));
                attempt += 1;
            }
        }
    }
}

/// Run a single pass over all candidate series.
///
/// Returns `Ok(true)` if at least one series was settled (or would be, in
/// dry-run), `Ok(false)` if nothing was actionable, and `Err` on a refusal or
/// hard failure. `submitted` tracks series already submitted this process so
/// we never submit twice for the same series.
fn run_pass<C: ChainClient>(
    client: &mut C,
    cli: &Cli,
    submitted: &mut HashSet<String>,
) -> Result<bool, KeeperError> {
    let ledger_time = with_retry(cli.max_retries, cli.backoff_ms, || client.ledger_time())?;
    info!(ledger_time, "fetched ledger close time");

    let series_list = with_retry(cli.max_retries, cli.backoff_ms, || {
        client.list_series(ledger_time, cli.lookahead_secs)
    })?;

    if series_list.is_empty() {
        info!("no series approaching or past expiry");
        return Ok(false);
    }

    let mut acted = false;
    for series in &series_list {
        if submitted.contains(&series.series_id) {
            info!(series = %series.series_id, "already submitted this run, skipping");
            continue;
        }

        let oracle = with_retry(cli.max_retries, cli.backoff_ms, || {
            client.oracle_snapshot(&series.symbol)
        })?;

        let decision = decide(series, &oracle, ledger_time);
        match decision {
            Decision::Settle { price } => {
                if cli.dry_run {
                    info!(
                        series = %series.series_id,
                        symbol = %series.symbol,
                        price,
                        report_count = oracle.report_count,
                        min_reports = oracle.min_reports,
                        last_report_ledger_time = ?oracle.last_report_ledger_time,
                        ledger_time,
                        "DRY RUN: would call set_settlement_price_from_oracle"
                    );
                    acted = true;
                } else {
                    info!(
                        series = %series.series_id,
                        symbol = %series.symbol,
                        price,
                        "submitting set_settlement_price_from_oracle"
                    );
                    with_retry(cli.max_retries, cli.backoff_ms, || {
                        client.settle(&series.series_id, price)
                    })?;
                    submitted.insert(series.series_id.clone());
                    acted = true;
                }
            }
            Decision::Skip(reason) => {
                info!(
                    series = %series.series_id,
                    symbol = %series.symbol,
                    reason = %reason,
                    "skipping series"
                );
            }
        }
    }

    Ok(acted)
}

fn main() -> ExitCode {
    tracing_subscriber::fmt()
        .with_env_filter(
            tracing_subscriber::EnvFilter::try_from_default_env()
                .unwrap_or_else(|_| tracing_subscriber::EnvFilter::new("info")),
        )
        .init();

    let cli = Cli::parse();

    // Validate key presence up front (unless dry-run, which never signs).
    if !cli.dry_run && cli.key.is_none() {
        error!("{}", KeeperError::MissingKey);
        return ExitCode::FAILURE;
    }

    // NOTE: the key is intentionally never logged. It is passed straight to
    // the signer inside the real ChainClient implementation.

    let mut client = match RealChainClient::new(&cli.rpc, cli.key.clone()) {
        Ok(c) => c,
        Err(e) => {
            error!(error = %e, "failed to construct chain client");
            return ExitCode::FAILURE;
        }
    };

    let mut submitted: HashSet<String> = HashSet::new();

    if cli.once {
        return match run_pass(&mut client, &cli, &mut submitted) {
            Ok(_) => ExitCode::SUCCESS,
            Err(e) => {
                error!(error = %e, "pass failed");
                ExitCode::FAILURE
            }
        };
    }

    // Polling mode.
    let interval = Duration::from_secs(cli.poll_interval.max(1));
    loop {
        match run_pass(&mut client, &cli, &mut submitted) {
            Ok(_) => {}
            Err(KeeperError::Refused { series, reason }) => {
                error!(series = %series, reason = %reason, "refusing to settle");
                return ExitCode::FAILURE;
            }
            Err(e) => {
                error!(error = %e, "pass failed; will retry next interval");
            }
        }
        std::thread::sleep(interval);
    }
}

/// Real chain client. This is a thin placeholder that documents the intended
/// RPC surface; the actual query/submit wiring lives alongside the chain's
/// generated client bindings.
struct RealChainClient {
    #[allow(dead_code)]
    rpc: String,
    #[allow(dead_code)]
    key: Option<String>,
}

impl RealChainClient {
    fn new(rpc: &str, key: Option<String>) -> Result<Self, KeeperError> {
        Ok(Self {
            rpc: rpc.to_string(),
            key,
        })
    }
}

impl ChainClient for RealChainClient {
    fn ledger_time(&mut self) -> Result<i64, KeeperError> {
        // Query the latest block header and return its close time.
        Err(KeeperError::Rpc(
            "ledger_time query not wired to a live endpoint".to_string(),
        ))
    }

    fn list_series(
        &mut self,
        _ledger_time: i64,
        _lookahead_secs: i64,
    ) -> Result<Vec<SeriesInfo>, KeeperError> {
        Err(KeeperError::Rpc(
            "list_series query not wired to a live endpoint".to_string(),
        ))
    }

    fn oracle_snapshot(&mut self, _symbol: &str) -> Result<OracleSnapshot, KeeperError> {
        Err(KeeperError::Rpc(
            "oracle_snapshot query not wired to a live endpoint".to_string(),
        ))
    }

    fn settle(&mut self, _series_id: &str, _price: i128) -> Result<(), KeeperError> {
        Err(KeeperError::Rpc(
            "settle submission not wired to a live endpoint".to_string(),
        ))
    }
}