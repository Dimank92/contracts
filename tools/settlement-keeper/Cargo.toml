//! Settlement keeper library.
//!
//! This crate exposes the pure decision logic used by the `settlement-keeper`
//! binary so it can be unit-tested without a network. The binary wires this
//! logic to RPC queries against `options_market` and `price_oracle` and to the
//! `options_market::set_settlement_price_from_oracle` entrypoint.
//!
//! Design notes:
//! - All time comparisons use the *ledger close time* reported by the chain,
//!   never the local wall clock, so clock skew between the operator's machine
//!   and the validator set cannot cause premature or missed settlements.
//! - The decision function is pure: it takes an oracle snapshot plus the
//!   series metadata and returns a [`Decision`] with a human-readable reason.
//! - Key material is never persisted or logged; it is read from the
//!   environment or a CLI flag and handed straight to the signer.

use std::fmt;

/// A single option series as observed from `options_market`.
#[derive(Debug, Clone, PartialEq, Eq)]
pub struct SeriesInfo {
    /// Stable identifier for the series (e.g. `"BTC-20240101-50000-C"`).
    pub series_id: String,
    /// The oracle symbol this series settles against.
    pub symbol: String,
    /// Ledger close time (seconds since epoch) at which the series expires.
    pub expiry_ledger_time: i64,
    /// Whether the series has already been settled on-chain.
    pub settled: bool,
}

/// A snapshot of the `price_oracle` aggregate for a single symbol.
#[derive(Debug, Clone, PartialEq, Eq)]
pub struct OracleSnapshot {
    /// Whether the symbol is registered with `price_oracle`.
    pub registered: bool,
    /// Aggregate price, if one is available.
    pub price: Option<i128>,
    /// Ledger close time (seconds since epoch) of the most recent report
    /// contributing to the aggregate.
    pub last_report_ledger_time: Option<i64>,
    /// Number of reports currently backing the aggregate.
    pub report_count: u32,
    /// Minimum number of reports required for a quorum.
    pub min_reports: u32,
    /// Maximum age (seconds) a report may have and still be considered fresh.
    pub max_staleness_secs: i64,
}

/// Why a series should not be settled right now.
#[derive(Debug, Clone, PartialEq, Eq)]
pub enum SkipReason {
    /// The series has already been settled on-chain.
    AlreadySettled,
    /// The series has not yet reached its expiry ledger time.
    NotYetExpired { seconds_until_expiry: i64 },
    /// The symbol is not registered with `price_oracle`.
    SymbolUnregistered,
    /// The aggregate has fewer reports than `min_reports`.
    BelowQuorum { report_count: u32, min_reports: u32 },
    /// The most recent report is older than `max_staleness_secs`.
    Stale { age_secs: i64, max_staleness_secs: i64 },
    /// No report has ever been observed for the symbol.
    NoReports,
    /// No aggregate price is available.
    NoPrice,
}

impl fmt::Display for SkipReason {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        match self {
            SkipReason::AlreadySettled => write!(f, "series already settled"),
            SkipReason::NotYetExpired {
                seconds_until_expiry,
            } => write!(
                f,
                "series not yet expired ({}s until expiry by ledger time)",
                seconds_until_expiry
            ),
            SkipReason::SymbolUnregistered => {
                write!(f, "symbol is not registered with price_oracle")
            }
            SkipReason::BelowQuorum {
                report_count,
                min_reports,
            } => write!(
                f,
                "aggregate below quorum: {} report(s) < min_reports {}",
                report_count, min_reports
            ),
            SkipReason::Stale {
                age_secs,
                max_staleness_secs,
            } => write!(
                f,
                "aggregate is stale: age {}s > max staleness {}s",
                age_secs, max_staleness_secs
            ),
            SkipReason::NoReports => write!(f, "no reports observed for symbol"),
            SkipReason::NoPrice => write!(f, "no aggregate price available"),
        }
    }
}

/// The outcome of evaluating a series for settlement.
#[derive(Debug, Clone, PartialEq, Eq)]
pub enum Decision {
    /// Safe to settle; carries the price to submit.
    Settle { price: i128 },
    /// Do not settle; carries the reason.
    Skip(SkipReason),
}

impl Decision {
    /// Returns `true` if the decision is to settle.
    pub fn is_settle(&self) -> bool {
        matches!(self, Decision::Settle { .. })
    }
}

/// Evaluate whether a series should be settled given the current oracle
/// snapshot and the current ledger close time.
///
/// This function is pure and performs no I/O. It is the single source of
/// truth for the keeper's settle/skip decision.
///
/// `ledger_time` is the current ledger close time in seconds since epoch, as
/// reported by the chain. It is used for all freshness and expiry checks so
/// that local clock skew cannot affect the decision.
pub fn decide(series: &SeriesInfo, oracle: &OracleSnapshot, ledger_time: i64) -> Decision {
    if series.settled {
        return Decision::Skip(SkipReason::AlreadySettled);
    }

    if ledger_time < series.expiry_ledger_time {
        return Decision::Skip(SkipReason::NotYetExpired {
            seconds_until_expiry: series.expiry_ledger_time - ledger_time,
        });
    }

    if !oracle.registered {
        return Decision::Skip(SkipReason::SymbolUnregistered);
    }

    if oracle.report_count == 0 {
        return Decision::Skip(SkipReason::NoReports);
    }

    if oracle.report_count < oracle.min_reports {
        return Decision::Skip(SkipReason::BelowQuorum {
            report_count: oracle.report_count,
            min_reports: oracle.min_reports,
        });
    }

    let last_report = match oracle.last_report_ledger_time {
        Some(t) => t,
        None => return Decision::Skip(SkipReason::NoReports),
    };

    // Guard against a report timestamped in the future relative to ledger
    // time: treat it as fresh (age 0) rather than underflowing.
    let age_secs = (ledger_time - last_report).max(0);
    if age_secs > oracle.max_staleness_secs {
        return Decision::Skip(SkipReason::Stale {
            age_secs,
            max_staleness_secs: oracle.max_staleness_secs,
        });
    }

    match oracle.price {
        Some(price) => Decision::Settle { price },
        None => Decision::Skip(SkipReason::NoPrice),
    }
}

#[cfg(test)]
mod tests {
    use super::*;

    fn series(settled: bool, expiry: i64) -> SeriesInfo {
        SeriesInfo {
            series_id: "BTC-20240101-50000-C".to_string(),
            symbol: "BTC/USD".to_string(),
            expiry_ledger_time: expiry,
            settled,
        }
    }

    fn oracle() -> OracleSnapshot {
        OracleSnapshot {
            registered: true,
            price: Some(50_000),
            last_report_ledger_time: Some(1_000),
            report_count: 5,
            min_reports: 3,
            max_staleness_secs: 60,
        }
    }

    #[test]
    fn settles_when_fresh_and_quorum() {
        let s = series(false, 1_000);
        let o = oracle();
        // Ledger time is at expiry, report is 10s old.
        let d = decide(&s, &o, 1_010);
        assert_eq!(d, Decision::Settle { price: 50_000 });
    }

    #[test]
    fn skips_already_settled() {
        let s = series(true, 1_000);
        let o = oracle();
        let d = decide(&s, &o, 1_010);
        assert_eq!(d, Decision::Skip(SkipReason::AlreadySettled));
    }

    #[test]
    fn skips_not_yet_expired() {
        let s = series(false, 2_000);
        let o = oracle();
        let d = decide(&s, &o, 1_010);
        assert_eq!(
            d,
            Decision::Skip(SkipReason::NotYetExpired {
                seconds_until_expiry: 990
            })
        );
    }

    #[test]
    fn skips_unregistered_symbol() {
        let s = series(false, 1_000);
        let mut o = oracle();
        o.registered = false;
        let d = decide(&s, &o, 1_010);
        assert_eq!(d, Decision::Skip(SkipReason::SymbolUnregistered));
    }

    #[test]
    fn skips_below_quorum() {
        let s = series(false, 1_000);
        let mut o = oracle();
        o.report_count = 2;
        o.min_reports = 3;
        let d = decide(&s, &o, 1_010);
        assert_eq!(
            d,
            Decision::Skip(SkipReason::BelowQuorum {
                report_count: 2,
                min_reports: 3
            })
        );
    }

    #[test]
    fn skips_stale_aggregate() {
        let s = series(false, 1_000);
        let o = oracle();
        // Report is 120s old, max staleness is 60s.
        let d = decide(&s, &o, 1_120);
        assert_eq!(
            d,
            Decision::Skip(SkipReason::Stale {
                age_secs: 120,
                max_staleness_secs: 60
            })
        );
    }

    #[test]
    fn skips_no_reports() {
        let s = series(false, 1_000);
        let mut o = oracle();
        o.report_count = 0;
        o.last_report_ledger_time = None;
        let d = decide(&s, &o, 1_010);
        assert_eq!(d, Decision::Skip(SkipReason::NoReports));
    }

    #[test]
    fn skips_no_price() {
        let s = series(false, 1_000);
        let mut o = oracle();
        o.price = None;
        let d = decide(&s, &o, 1_010);
        assert_eq!(d, Decision::Skip(SkipReason::NoPrice));
    }

    #[test]
    fn future_report_timestamp_is_treated_as_fresh() {
        let s = series(false, 1_000);
        let mut o = oracle();
        o.last_report_ledger_time = Some(1_050);
        let d = decide(&s, &o, 1_010);
        assert_eq!(d, Decision::Settle { price: 50_000 });
    }

    #[test]
    fn uses_ledger_time_not_local_time() {
        // Even if the local clock would say "expired", the decision must be
        // driven entirely by the passed-in ledger time.
        let s = series(false, 5_000);
        let o = oracle();
        let d = decide(&s, &o, 1_000);
        assert!(matches!(d, Decision::Skip(SkipReason::NotYetExpired { .. })));
    }
}
