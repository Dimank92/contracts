[package]
name = "zenith-governor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
zenith-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Dev/test-only: a REAL timelock instance for lifecycle tests. Production
# code calls it through the interface in src/interfaces.rs instead.
timelock = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
