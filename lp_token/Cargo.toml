[package]
name = "zenith-lp-token"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# rlib alongside cdylib so lp_pool can register a real share token in
# its tests, same as multisig and params.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
zenith-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
