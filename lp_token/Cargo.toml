[package]
name = "zenith-lp-token"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# rlib alongside cdylib so lp_pool can register a real share token in
# its tests, same as multisig and params.
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1

[dependencies]
soroban-sdk = { version = "21.0.0" }
zenith-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
