[package]
name = "zenith-price-oracle"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# rlib alongside cdylib so other contracts' tests (options_market,
# integration_tests) can register a real price_oracle natively, while it
# still builds a deployable wasm cdylib on its own.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
zenith-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Property-based tests for the math modules (see README "Property tests").
proptest = "1"
# Dev/test-only: registers a REAL multisig contract instance inside the
# test Env for the `_via_multisig` tests. price_oracle itself reaches it
# through zenith-common's invoke_contract, not a client.
multisig = { workspace = true, features = ["testutils"] }
# Adversarial mock contracts for negative-path cross-contract tests (issue #115).
test_adversaries = { package = "zenith-test-adversaries", path = "../test_adversaries" }

[features]
testutils = ["soroban-sdk/testutils"]
