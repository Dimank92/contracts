[workspace]
# resolver 2 keeps dev-dependency features (every `features = ["testutils"]`
# below) out of plain `cargo build` graphs, and xtask builds each contract's
# wasm with its own `-p` invocation so no other member's features are
# unified into it. `cargo xtask check-wasm` verifies the result.
resolver = "2"
members = [
    "common",
    "governor",
    "grants_escrow",
    "integration_tests",
    "lp_pool",
    "lp_token",
    "multisig",
    "options_market",
    "params",
    "price_oracle",
    "staking",
    "streams",
    "test_adversaries",
    "timelock",
    "vault",
    "tools/event-spec",
    "tools/spec-diff",
    "tools/vault-ops",
    "xtask",
]

# Crates whose sources are missing on main (their lib.rs was emptied or
# truncated by earlier merges; see README "Known gaps"). `cargo xtask`
# skips them unless one is named with -p, so the rest of the workspace
# can be built, linted and tested.
[workspace.metadata.zenith]
incomplete = [
    "zenith-integration-tests",
    "zenith-options-market",
    "zenith-price-oracle",
    "zenith-test-adversaries",
    "zenith-timelock",
    "zenith-vault",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
# Embedded in every wasm as `source_repo` (common/build_meta.rs).
repository = "https://github.com/Zenith-options/contracts"

[workspace.dependencies]
soroban-sdk = { version = "21.7.7" }
ed25519-dalek = "2"
proptest = "1"

# Internal crates. Contracts that call each other on-chain use
# `contractimport!` against the compiled wasm (see
# `[package.metadata.zenith] wasm-deps` in each manifest); these entries are
# only for dev-dependencies that register a real instance in a test Env,
# plus the zenith-common rlib.
zenith-common = { path = "common" }
governor = { package = "zenith-governor", path = "governor" }
lp_pool = { package = "zenith-lp-pool", path = "lp_pool" }
lp_token = { package = "zenith-lp-token", path = "lp_token" }
multisig = { package = "zenith-multisig", path = "multisig" }
options_market = { package = "zenith-options-market", path = "options_market" }
params = { package = "zenith-params", path = "params" }
price_oracle = { package = "zenith-price-oracle", path = "price_oracle" }
timelock = { package = "zenith-timelock", path = "timelock" }
vault = { package = "zenith-vault", path = "vault" }

# Shared by every contract (profiles in member manifests are ignored inside
# a workspace).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1

# Coverage instrumentation for the CI coverage gate (issue #221).
# `cargo llvm-cov` reads this profile; keeping it in the workspace root means
# the per-crate thresholds in `.github/coverage-thresholds.toml` are measured
# against a stable, reproducible build. `debug = 1` keeps line tables so
# llvm-cov can map regions back to source without bloating artifacts.
[profile.coverage]
inherits = "dev"
opt-level = 0
debug = 1
incremental = false
