[alias]
# `cargo xtask <cmd>` — see xtask/src/main.rs or `cargo xtask help`.
xtask = "run --quiet --package xtask --"

# Rust >= 1.82 turns on wasm `reference-types` (and other post-MVP
# features) by default for wasm32-unknown-unknown, which the Soroban 21
# host refuses to load ("reference-types not enabled"). Target the MVP
# feature set so `cargo xtask build` output is deployable on any
# toolchain.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-cpu=mvp"]
