[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Build automation for the workspace (the cargo-xtask pattern):
# `cargo xtask help`. Native-only; never built for wasm.

[dependencies]
serde_json = "1"
soroban-spec = "=21.7.7"
stellar-xdr = { version = "=21.2.0", features = ["curr", "std"] }
