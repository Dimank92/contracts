# cargo-deny configuration for the Zenith contracts workspace.
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Allow common open-source licenses used by the Rust ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
# Fail on any license not in the allow list.
unlicensed = "deny"
copyleft = "warn"

# Some crates don't specify their license clearly; allow these known ones.
exceptions = [
    # soroban-sdk and stellar crates use Apache-2.0 but may have
    # some sub-crates with unusual expressions.
]

[bans]
# Warn on multiple versions of the same crate — use `skip` to silence
# known unavoidable duplicates from upstream dependencies.
multiple-versions = "warn"

# Don't allow these crates at all.
deny = []

# Skip duplicate-version warnings for these crates that have hard-to-align
# transitive dependency constraints across the workspace.
skip = [
    # Upstream soroban toolchain may pull in multiple versions of these.
    { name = "syn" },
    { name = "proc-macro2" },
    { name = "quote" },
]

[advisories]
# Fail on any unpatched vulnerability from the RustSec database.
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"

# Known exceptions: none.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
