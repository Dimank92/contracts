[package]
name = "zenith-common"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# Plain rlib only: this crate defines no #[contract], so linking it into
# every contract can't collide on exported symbol names.
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
