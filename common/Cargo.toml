[package]
name = "zenith-common"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Plain rlib only: this crate defines no #[contract], so linking it into
# every contract can't collide on exported symbol names.
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Checks the framework's events against events.json (#126).
event-spec = { path = "../tools/event-spec" }
