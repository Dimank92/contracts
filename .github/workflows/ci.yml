name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Embedded in every wasm as the `commit` contractmeta (common/build_meta.rs).
  ZENITH_GIT_COMMIT: ${{ github.sha }}
  STELLAR_CLI_VERSION: 28.1.0

# Every job goes through `cargo xtask` (xtask/src/main.rs, `cargo xtask
# help`). Contracts that contractimport! other contracts' wasm declare them
# in `[package.metadata.zenith] wasm-deps`, and xtask builds that wasm in
# dependency order into the shared target/, so there are no per-crate
# build chains here. Crates listed under `[workspace.metadata.zenith]
# incomplete` (sources missing on main, see README "Known gaps") are
# skipped. `cargo xtask ci` runs lint + build + test locally.
#
# binaryen is installed wherever wasm is built: `cargo xtask build`
# re-encodes the wasm as MVP so the Soroban 21 host can load it (README,
# "Building and testing").

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask fmt --check
      - run: cargo xtask check-imports
      # No unwrap/expect/panic in contract code; every entrypoint returns
      # Result (#124).
      - run: cargo xtask check-panics
      # docs/errors.md and docs/events-reference.md match the sources.
      - run: cargo xtask errors --check
      - run: cargo xtask events --check
      - run: cargo xtask clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      # Includes each crate's extra-test run, e.g. multisig's upgrade-wasm
      # tests against its own built wasm.
      - run: cargo xtask test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: cargo xtask build
      # Fails if soroban-sdk/testutils (or the host) leaked into any
      # release wasm through workspace feature unification.
      - run: cargo xtask check-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: target/wasm32-unknown-unknown/release/*.wasm

  # The @zenith/contracts TypeScript package (#125): generated clients must
  # match the contracts' current spec, and the package must type-check.
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Install stellar-cli
        run: |
          curl -sSfL -o /tmp/stellar.tgz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin" && tar xzf /tmp/stellar.tgz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo xtask bindings --check
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bindings/package-lock.json
      - run: npm ci
        working-directory: bindings
      - run: npm run typecheck
        working-directory: bindings
      - run: npm test
        working-directory: bindings

  # Public-ABI guard: every existing function, type and error in each
  # contract's spec must survive unchanged (additions are fine) unless
  # the PR lists it in tools/spec-diff/allow.txt. Also prints the wasm
  # size delta against the base branch.
  spec-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: tools/spec-diff/check.sh origin/${{ github.base_ref }}

  budgets:
    runs-on: ubuntu-latest
    env:
      CONTRACTS: governor grants_escrow lp_pool lp_token multisig params staking streams
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: cargo xtask build
      # Prints raw and optimized size per contract to the job summary and
      # fails above budget.
      - name: Optimize and enforce wasm size budgets
        run: scripts/wasm-size/check.sh $CONTRACTS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimized-wasm
          path: target/wasm-opt/*.wasm
          if-no-files-found: warn
      - name: resource-snapshot self-tests
        if: always()
        run: cargo test
        working-directory: tools/resource-snapshot
