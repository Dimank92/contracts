name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every job goes through `cargo xtask` (xtask/src/main.rs). Contracts that
# contractimport! other contracts' wasm (options_market imports
# price_oracle, vault and params) declare them in
# `[package.metadata.zenith] wasm-deps`, and xtask builds that wasm in
# dependency order into the shared target/ before compiling anything
# that needs it — so there are no per-crate build chains here.
# `cargo xtask ci` runs all of it locally.
#
# Not run until their inputs exist again: the spec-diff ABI guard
# (tools/spec-diff/check.sh is empty) and the wasm size / resource budget
# gate (scripts/wasm-size/budgets.txt has no recorded budgets and
# options_market has no resource snapshots).

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo xtask fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-imports
      - run: cargo xtask clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test

  # The end-to-end suites (option lifecycle, timelock-held admin,
  # governance handover) as their own check, so a broken seam between
  # contracts is visible at a glance on every PR. Offline: one Soroban
  # Env, no network.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test -p integration_tests

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask build
      # Fails if soroban-sdk/testutils (or the host) leaked into any
      # release wasm through workspace feature unification.
      - run: cargo xtask check-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
