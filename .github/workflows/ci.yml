name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every job goes through `cargo xtask` (xtask/src/main.rs). Contracts that
# contractimport! other contracts' wasm declare them in
# `[package.metadata.zenith] wasm-deps`, and xtask builds that wasm in
# dependency order into the shared target/ — so there are no per-crate
# build chains here. `cargo xtask ci` runs all of it locally.
#
# options_market cross-contract-calls price_oracle, multisig, vault, AND
# params (its parameter registry) via
# soroban-sdk's contractimport! against their compiled wasm (not a normal
# source dependency, to avoid linking their own contract functions into
# options_market's wasm and colliding on shared names like
# pause/transfer_admin). That means all four wasm files have to exist
# before options_market can even be *compiled*, native target included —
# every job below installs wasm32-unknown-unknown and builds price_oracle's,
# multisig's, vault's, and params' wasm first when it's about to touch
# options_market.
#
# price_oracle and vault each also now cross-call multisig the same way
# (for pause_via_multisig/unpause_via_multisig/transfer_admin_via_multisig),
# so both need multisig's wasm built first too — that's also why the
# multisig build step above runs before the vault build step, not just
# before options_market's.

jobs:
  # Hard gate: the workspace must compile cleanly, every crate must have a
  # compilable target, and no #[ignore] annotation is permitted without a
  # tracking-issue reference. This catches stub/empty crates and stale
  # test skips that would otherwise keep CI green while code drifts.
  workspace-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace (all targets)
        run: cargo build --workspace --all-targets
      - name: Dry-run workspace tests (no-run)
        run: cargo test --workspace --no-run
      - name: Check #[ignore] annotations reference a tracking issue
        run: cargo xtask check-ignore

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-imports
      - run: cargo xtask check-layering
      - run: cargo xtask clippy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [options_market, price_oracle, vault, multisig, common, streams,
                staking, timelock, governor, params, grants_escrow, lp_token,
                lp_pool, integration_tests, tools/resource-snapshot]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test -p ${{ matrix.crate }}

  wasm-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask build
      # Fails if soroban-sdk/testutils (or the host) leaked into any
      # release wasm through workspace feature unification.
      - run: cargo xtask check-wasm
      # README/docs function tables vs the built wasm spec; known gaps in
      # xtask/doc-spec-allow.txt.
      - run: cargo xtask doc-spec-check
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: target/wasm32-unknown-unknown/release/*.wasm

  # Rustdoc gate: undocumented public items and broken intra-doc links fail.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask doc

  # Entrypoint interface vs the committed baselines in tools/api-diff/baselines.
  api-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p api-diff -p multisig-cli
      - run: tools/api-diff/run.sh check

  # Public-ABI guard: every existing function, type and error in each
  # contract's spec must survive unchanged (additions are fine) unless
  # the PR lists it in tools/spec-diff/allow.txt. Also prints the wasm
  # size delta against the base branch.
  spec-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: tools/spec-diff/check.sh origin/${{ github.base_ref }}

  budgets:
    runs-on: ubuntu-latest
    env:
      # Every #[contract] crate that builds to a deployable wasm. `common`
      # is a plain rlib (no #[contract]) and is excluded; test/adversary
      # crates (integration_tests, tools/*) are native-only and excluded.
      # Build order: options_market needs multisig, price_oracle, vault and
      # params wasm first (see the note at the top of this file).
      CONTRACTS: multisig price_oracle vault params options_market streams staking governor grants_escrow lp_token lp_pool timelock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build every contract wasm (release)
        run: |
          for c in $CONTRACTS; do
            (cd "$c" && cargo build --target wasm32-unknown-unknown --release)
          done
      # Prints raw and optimized size per contract to the job summary and
      # fails above budget, reporting the offending crate, its size and the
      # delta against the checked-in budget. --in-place swaps each release
      # wasm for its optimized build so the steps below test what would be
      # deployed.
      - name: Optimize and enforce wasm size budgets
        run: scripts/wasm-size/check.sh --in-place $CONTRACTS
      # Raw release artifacts, for inspection and reuse by the
      # deployment-script work.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimized-wasm
          path: target/wasm-opt/*.wasm
          if-no-files-found: warn
      - name: resource-snapshot self-tests
        if: always()
        run: cargo test
        working-directory: tools/resource-snapshot
      # Registers the optimized options_market wasm (resource-wasm feature)
      # and fails if any metric regresses more than its tolerance (5% by
      # default) against options_market/snapshots/resources/.
      - name: Resource snapshots (optimized wasm)
        if: always()
        run: cargo test --features resource-wasm resource_snapshots
        working-directory: options_market
      - name: Resource summary table
        if: always()
        run: >
          python3 scripts/resource-diff/resource_diff.py
          ${{ github.event_name == 'pull_request' && format('--base-ref origin/{0}', github.base_ref) || '' }}
          options_market

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.lock is committed
        run: git ls-files --error-unmatch Cargo.lock
      # rust-toolchain.toml selects the pinned rustc; cache the toolchain only.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.81.0
          targets: wasm32-unknown-unknown
      - name: Two clean builds hash identically
        run: scripts/reproducible-build/verify.sh
      - name: Gate detects injected drift
        run: "! VERIFY_INJECT_DRIFT=1 scripts/reproducible-build/verify.sh"
      - name: Cargo.lock unchanged by build
        run: git diff --exit-code Cargo.lock

  # Workspace test-coverage gate (issue #221).
  #
  # Runs the workspace test suite under cargo-llvm-cov and fails the build
  # when any crate's line coverage drops below the floor committed in
  # .github/coverage-thresholds.toml. This is a fail-on-decrease ratchet, not
  # a fixed absolute target: the baseline starts near zero for the stub
  # crates and is raised in the same PR that un-ignores a suite.
  #
  # Trigger strategy: coverage is expensive, so it runs on pull_request only
  # (not on every push to main). A flaky coverage run fails closed — the
  # comparison script exits non-zero on any missing/unparseable report.
  #
  # Ignored tests are counted and reported separately so an increase in the
  # #[ignore] population is visible in the PR output.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run workspace tests under coverage
        # Exclude wasm-only code paths and generated bindings so the numbers
        # stay stable across runs.
        run: >
          cargo llvm-cov --workspace --all-targets --no-fail-fast
          --ignore-filename-regex '(^|/)(target|wasm|generated|bindings)/'
          --lcov --output-path target/coverage/lcov.info
      - name: Per-crate coverage summary
        run: >
          cargo llvm-cov report
          --lcov --input-path target/coverage/lcov.info
          --summary-only
      - name: Count ignored tests
        run: |
          count=$(grep -rE '#\[ignore' --include='*.rs' . | wc -l)
          echo "Ignored tests: $count" >> "$GITHUB_STEP_SUMMARY"
          echo "ignored_tests=$count" >> "$GITHUB_OUTPUT"
        id: ignored
      - name: Enforce per-crate coverage thresholds
        # Fails closed: a missing threshold file, an unrecognised crate, or an
        # unparseable report all exit non-zero rather than silently passing.
        run: >
          python3 scripts/coverage/check_thresholds.py
          --thresholds .github/coverage-thresholds.toml
          --lcov target/coverage/lcov.info
          --ignored "${{ steps.ignored.outputs.ignored_tests }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: warn
